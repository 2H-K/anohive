apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: anohive
      component: monitor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anohive
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
