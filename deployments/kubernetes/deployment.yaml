apiVersion: apps/v1
kind: Deployment
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
    component: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anohive
      component: monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: anohive
        component: monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: anohive
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: anohive
          image: anohive/anohive:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
          envFrom:
            - configMapRef:
                name: anohive-config
            - secretRef:
                name: anohive-secrets
          env:
            - name: PULSE_DB_PATH
              value: "/var/lib/anohive/data/anohive.db"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/anohive/data
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anohive-data
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
