apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse
  namespace: pulse-monitoring
  labels:
    app: pulse
spec:
  podSelector:
    matchLabels:
      app: pulse
      component: monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: pulse-monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
