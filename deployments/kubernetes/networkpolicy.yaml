apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
spec:
  podSelector:
    matchLabels:
      app: anohive
      component: monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: anohiveing
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
