apiVersion: v1
kind: Service
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: anohive
    component: monitor
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anohive
  namespace: anohiveing
  labels:
    app: anohive
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "anohive"
spec:
  ingressClassName: nginx
  rules:
    - host: anohive.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anohive
                port:
                  number: 80
