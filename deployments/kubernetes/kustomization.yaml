apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anohiveing

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app: anohive
  managed-by: kustomize

images:
  - name: anohive/anohive
    newTag: latest

configMapGenerator:
  - name: anohive-config
    behavior: merge
    literals:
      - PULSE_LOG_LEVEL=info
      - PULSE_LOG_FORMAT=json
