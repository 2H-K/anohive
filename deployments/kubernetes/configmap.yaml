apiVersion: v1
kind: ConfigMap
metadata:
  name: anohive-config
  namespace: anohiveing
  labels:
    app: anohive
data:
  PULSE_HOST: "0.0.0.0"
  ANOHIVE_PORT: "8200"
  PULSE_RETENTION_HOURS: "168"
  PULSE_MAX_LOGS: "1000000"
  PULSE_LOG_LEVEL: "info"
  PULSE_LOG_FORMAT: "json"
  PULSE_ALLOWED_ORIGINS: "*"
  PULSE_RATE_LIMIT: "100"
  PULSE_WS_MAX_CONNECTIONS: "100"
  PULSE_MAX_BODY_SIZE: "10485760"
  PULSE_CLEANUP_INTERVAL: "3600"
  PULSE_CORS_ORIGIN: "*"
  PULSE_READ_TIMEOUT: "15"
  PULSE_WRITE_TIMEOUT: "15"
  PULSE_GRACEFUL_TIMEOUT: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: anohive-secrets
  namespace: anohiveing
  labels:
    app: anohive
type: Opaque
stringData:
  PULSE_API_KEY: "change-me-in-production"
