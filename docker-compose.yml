version: '3.8'

services:
  anohive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anohive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ANOIVE_DB_PATH=/var/lib/anohive/data/anohive.db
      - ANOIVE_RETENTION_HOURS=168
      - ANOIVE_MAX_LOGS=1000000
      - ANOIVE_API_KEY=${ANOIVE_API_KEY:-anohive-dev-key-2024}
      - ANOIVE_LOG_LEVEL=info
      - ANOIVE_LOG_FORMAT=json
      - ANOIVE_ALLOWED_ORIGINS=*
      - ANOIVE_RATE_LIMIT=100
      - ANOIVE_WS_MAX_CONNECTIONS=100
      - ANOIVE_MAX_BODY_SIZE=10485760
      - ANOIVE_CLEANUP_INTERVAL=3600
    volumes:
      - anohive-data:/var/lib/anohive/data
      - ./configs:/etc/anohive:ro
    networks:
      - anohive-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "app=anohive"
      - "component=monitor"

  # Optional: Log collector sidecar
  anohive-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anohive-collector
    restart: unless-stopped
    command:
      - anohive-cli
      - collect
      - --directory
      - /var/log/apps
      - --url
      - http://anohive:8080/api/logs/raw
      - --api-key
      - ${ANOIVE_API_KEY:-anohive-dev-key-2024}
    volumes:
      - app-logs:/var/log/apps:ro
    networks:
      - anohive-net
    depends_on:
      anohive:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "app=anohive"
      - "component=collector"
    profiles:
      - collector

volumes:
  anohive-data:
    driver: local
  app-logs:
    driver: local

networks:
  anohive-net:
    driver: bridge
